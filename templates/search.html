{% extends 'base.html' %}{% block heading %}Course Search{% endblock %}{% block content %}<div class="page-intro"><p>Search the course catalogue by title or course code.</p></div><section class="panel"><form method="get" class="search-form"><label for="q">Search courses</label><div class="search-input-row"><input id="q" name="q" value="{{ q }}" maxlength="100" placeholder="e.g. database or 23CS"><button class="button primary">Search</button></div></form><div class="table-wrap"><table><thead><tr><th>Course code</th><th>Course name</th><th>Faculty</th></tr></thead><tbody>{% for c in rows %}<tr><td><strong>{{ c.code }}</strong></td><td>{{ c.name }}</td><td>{{ c.faculty }}</td></tr>{% else %}<tr><td colspan="3" class="empty-state">No matching courses found.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
